# render.yaml — Render Blueprint
# Push this to your repo, then connect to Render via "New → Blueprint"
# Docs: https://render.com/docs/blueprint-spec

services:
  - type: web
    name: dppmp-api
    runtime: python
    region: singapore  # closest to Cambodia
    plan: free         # upgrade to "starter" ($7/mo) to avoid sleep
    buildCommand: pip install -r requirements.txt && python scripts/train_model.py
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    envVars:
      - key: DATABASE_URL
        sync: false      # set manually in Render dashboard
      - key: MODEL_PATH
        value: models/risk_model.pkl
      - key: ALLOWED_ORIGINS
        sync: false      # e.g. https://dppmp.vercel.app
      - key: LOG_LEVEL
        value: INFO
      - key: PYTHON_VERSION
        value: "3.11.7"
